<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="OT attack surface from external access paths through trust boundaries to control systems and physical process"><rect width="1400" height="760" rx="24" fill="#0b111c"/><text x="54" y="54" fill="#f3f6fa" font-family="Inter,Arial" font-size="30" font-weight="700">The OT attack surface: paths to operational consequence</text><text x="54" y="84" fill="#9aa8b8" font-family="Inter,Arial" font-size="14">The controller is only one part of the attack surface. Trusted connections around it can become adversary conduits.</text><text x="70" y="126" fill="#4fd1c5" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600">EXTERNAL / ENTERPRISE PATHS</text><text x="525" y="126" fill="#4fd1c5" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600">CONTROLLED BOUNDARY</text><text x="800" y="126" fill="#4fd1c5" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600">OT CONTROL ENVIRONMENT</text><text x="1160" y="126" fill="#4fd1c5" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="600">PHYSICAL PROCESS</text><g font-family="Inter,Arial"><g fill="#101a29" stroke="#26364c"><rect x="60" y="158" width="360" height="62" rx="12"/><rect x="60" y="240" width="360" height="62" rx="12"/><rect x="60" y="322" width="360" height="62" rx="12"/><rect x="60" y="404" width="360" height="62" rx="12"/><rect x="60" y="486" width="360" height="62" rx="12"/><rect x="60" y="568" width="360" height="62" rx="12"/></g><g fill="#4fd1c5"><circle cx="88" cy="189" r="8"/><circle cx="88" cy="271" r="8"/><circle cx="88" cy="353" r="8"/><circle cx="88" cy="435" r="8"/><circle cx="88" cy="517" r="8"/><circle cx="88" cy="599" r="8"/></g><g fill="#f3f6fa" font-size="17" font-weight="600"><text x="110" y="184">Internet-facing ICS</text><text x="110" y="266">Remote / vendor access</text><text x="110" y="348">Enterprise IT / identity</text><text x="110" y="430">Private cellular / WAN</text><text x="110" y="512">Supplier / update path</text><text x="110" y="594">Cloud / communications</text></g><g fill="#9aa8b8" font-size="13"><text x="110" y="205">PLC · HMI · web interface</text><text x="110" y="287">VPN · RDP · VNC · gateway</text><text x="110" y="369">AD · credentials · admin tooling</text><text x="110" y="451">APN · modem · remote site</text><text x="110" y="533">software · integrator · engineering</text><text x="110" y="615">satellite · SaaS · telemetry</text></g></g><g stroke="#4fd1c5" stroke-width="3"><path d="M420 189H515"/><path d="M420 271H515"/><path d="M420 353H515"/><path d="M420 435H515"/><path d="M420 517H515"/><path d="M420 599H515"/></g><rect x="520" y="154" width="220" height="510" rx="18" fill="#101a29" stroke="#e8a33d" stroke-width="2"/><g fill="#0b111c" stroke="#26364c"><rect x="548" y="182" width="164" height="64" rx="10"/><rect x="548" y="274" width="164" height="64" rx="10"/><rect x="548" y="366" width="164" height="64" rx="10"/><rect x="548" y="458" width="164" height="64" rx="10"/><rect x="548" y="550" width="164" height="64" rx="10"/></g><g text-anchor="middle" font-family="Inter,Arial"><g fill="#f3f6fa" font-size="15" font-weight="600"><text x="630" y="209">Firewall / ACL</text><text x="630" y="301">VPN / gateway</text><text x="630" y="393">Jump host</text><text x="630" y="485">Segmentation</text><text x="630" y="577">Monitoring</text></g><g fill="#9aa8b8" font-size="11"><text x="630" y="229">allow by exception</text><text x="630" y="321">authenticate + encrypt</text><text x="630" y="413">inspect + record</text><text x="630" y="505">limit lateral movement</text><text x="630" y="597">make paths observable</text></g></g><g fill="#101a29" stroke="#26364c"><rect x="790" y="168" width="300" height="64" rx="12"/><rect x="790" y="260" width="300" height="64" rx="12"/><rect x="790" y="352" width="300" height="64" rx="12"/><rect x="790" y="444" width="300" height="64" rx="12"/><rect x="790" y="536" width="300" height="64" rx="12"/></g><g font-family="Inter,Arial"><g fill="#f3f6fa" font-size="17" font-weight="600"><text x="812" y="195">Engineering workstation</text><text x="812" y="287">HMI / SCADA</text><text x="812" y="379">Historian / OT servers</text><text x="812" y="471">PLC / RTU / IED</text><text x="812" y="563">SIS / safety controller</text></g><g fill="#9aa8b8" font-size="12"><text x="812" y="216">programs / configures controllers</text><text x="812" y="308">supervisory visibility and control</text><text x="812" y="400">context, data and dependencies</text><text x="812" y="492">direct process control</text><text x="812" y="584">independent protection layer</text></g></g><rect x="1150" y="190" width="190" height="392" rx="22" fill="#101a29" stroke="#26364c"/><g fill="#4fd1c5"><circle cx="1182" cy="230" r="9"/><circle cx="1182" cy="310" r="9"/><circle cx="1182" cy="390" r="9"/><circle cx="1182" cy="470" r="9"/><circle cx="1182" cy="550" r="9"/></g><g fill="#f3f6fa" font-family="Inter,Arial" font-size="15"><text x="1205" y="236">Pumps / valves</text><text x="1205" y="316">Turbines / drives</text><text x="1205" y="396">Treatment / chemistry</text><text x="1205" y="476">Breakers / relays</text><text x="1205" y="556">Safety / shutdown</text></g><path d="M1090 354H1150" stroke="#4fd1c5" stroke-width="4"/><rect x="56" y="690" width="1288" height="42" rx="10" fill="#0f1e26" stroke="#2aa9b8"/><text x="700" y="717" fill="#4fd1c5" font-family="IBM Plex Mono,monospace" font-size="15" text-anchor="middle">THE SECURITY OBJECTIVE IS NOT “NO CONNECTIVITY” — IT IS DELIBERATE, LEAST-PRIVILEGED AND OBSERVABLE CONNECTIVITY</text></svg>