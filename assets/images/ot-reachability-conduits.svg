<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">The common OT cybersecurity problem: reachability</title><desc id="d">Common external access routes pass through controlled conduits into OT systems including engineering workstations, HMI/SCADA, PLCs and the physical process.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#0c1726"/></linearGradient></defs><rect width="1200" height="900" rx="28" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="70" font-size="44" font-weight="700" fill="#f3f5f8">The Common Problem: <tspan fill="#4fd1c5">Reachability</tspan></text><text x="60" y="108" font-size="18" fill="#aab7c7">Before an attacker can manipulate a controller or interrupt a process, they need a route to it.</text><!-- top incident strip --><g><rect x="60" y="150" width="330" height="145" rx="18" fill="#0e1a2a" stroke="#2d7180"/><text x="85" y="188" font-size="20" font-weight="700" fill="#4fd1c5">US Water Utilities</text><text x="85" y="222" font-size="14" fill="#8fa0b4">NOTE</text><text x="140" y="222" font-size="15" fill="#f3f5f8">Internet-facing PLCs</text><text x="85" y="255" font-size="14" fill="#8fa0b4">LESSON</text><text x="150" y="255" font-size="15" fill="#f3f5f8">Remove direct public exposure</text></g><g><rect x="435" y="150" width="330" height="145" rx="18" fill="#111925" stroke="#8b5a27"/><text x="460" y="188" font-size="20" font-weight="700" fill="#e8a33d">UK Generator</text><text x="460" y="222" font-size="14" fill="#9d8d7c">NOTE</text><text x="515" y="222" font-size="15" fill="#f3f5f8">Four-day outage</text><text x="460" y="255" font-size="14" fill="#9d8d7c">LESSON</text><text x="525" y="255" font-size="15" fill="#f3f5f8">Access control + recovery matter</text></g><g><rect x="810" y="150" width="330" height="145" rx="18" fill="#0e1a2a" stroke="#2d7180"/><text x="835" y="188" font-size="20" font-weight="700" fill="#4fd1c5">Poland Energy Sector</text><text x="835" y="222" font-size="14" fill="#8fa0b4">NOTE</text><text x="890" y="222" font-size="15" fill="#f3f5f8">Private APN used at a CHP plant</text><text x="835" y="255" font-size="14" fill="#8fa0b4">LESSON</text><text x="900" y="255" font-size="15" fill="#f3f5f8">Private ≠ automatically segmented</text></g><!-- columns --><text x="180" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#4fd1c5">COMMON ACCESS ROUTES</text><text x="600" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#4fd1c5">CONTROLLED CONDUITS</text><text x="1010" y="360" text-anchor="middle" font-size="18" font-weight="700" fill="#4fd1c5">OT ENVIRONMENT</text><g fill="#101d2e" stroke="#355168"><rect x="60" y="395" width="245" height="80" rx="12"/><rect x="60" y="490" width="245" height="80" rx="12"/><rect x="60" y="585" width="245" height="80" rx="12"/><rect x="60" y="680" width="245" height="80" rx="12"/><rect x="470" y="395" width="260" height="80" rx="12"/><rect x="470" y="490" width="260" height="80" rx="12"/><rect x="470" y="585" width="260" height="80" rx="12"/><rect x="470" y="680" width="260" height="80" rx="12"/><rect x="865" y="395" width="275" height="80" rx="12"/><rect x="865" y="490" width="275" height="80" rx="12"/><rect x="865" y="585" width="275" height="80" rx="12"/><rect x="865" y="680" width="275" height="80" rx="12"/></g><g font-size="18" fill="#f3f5f8"><text x="90" y="432">Internet</text><text x="90" y="527">Vendor Remote Access</text><text x="90" y="622">Private Cellular APN</text><text x="90" y="717">Compromised IT Network</text><text x="500" y="432">Firewall</text><text x="500" y="527">VPN / Secure Gateway</text><text x="500" y="622">Jump Host</text><text x="500" y="717">Segmentation Barrier</text><text x="895" y="432">Engineering Workstation</text><text x="895" y="527">HMI / SCADA</text><text x="895" y="622">PLC / RTU</text><text x="895" y="717">Physical Process</text></g><g font-size="13" fill="#8fa0b4"><text x="90" y="455">Untrusted</text><text x="90" y="550">External</text><text x="90" y="645">External</text><text x="90" y="740">Internal risk</text><text x="500" y="455">Allow by exception</text><text x="500" y="550">Authenticate and encrypt</text><text x="500" y="645">Inspect and monitor</text><text x="500" y="740">Limit scope and movement</text><text x="895" y="455">Configure and maintain</text><text x="895" y="550">Supervise and control</text><text x="895" y="645">Control equipment</text><text x="895" y="740">Operations</text></g><g stroke="#4fd1c5" stroke-width="3" fill="none"><path d="M305 435H470"/><path d="M305 530H470"/><path d="M305 625H470"/><path d="M305 720H470"/><path d="M730 435H865"/><path d="M730 530H865"/><path d="M730 625H865"/><path d="M730 720H865"/></g><g fill="#e8a33d"><circle cx="797" cy="435" r="7"/><circle cx="797" cy="530" r="7"/><circle cx="797" cy="625" r="7"/><circle cx="797" cy="720" r="7"/></g><rect x="60" y="800" width="1080" height="58" rx="14" fill="#0f1c2c" stroke="#2d7180"/><text x="600" y="836" text-anchor="middle" font-size="17" fill="#d4dde7">Every path should be <tspan fill="#4fd1c5" font-weight="700">intentional, least-privileged and observable.</tspan></text></g></svg>